name: Run PARVAAH Data Pipeline

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pipeline Once
        env:
          RAILRADAR_API_KEY: ${{ secrets.RAILRADAR_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python pipeline.py --once

      # If using SQLite stored in repo, commit the updated DB back to main
      - name: Commit and push DB changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.db  # Adjust to your database file name/path
          git commit -m "auto: update train logs [skip ci]" || exit 0
          git push
